<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aditya Kopalli — engineering logbook</title>
  <meta name="description" content="Salesforce engineering work: predictive scoring, MuleSoft integration pipelines, Agentforce, and intelligent appointment management." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="layout">
    <aside class="rail">
      <div class="rail-inner">
        <div class="rail-id">
          <h1 class="rail-name">Aditya<br />Kopalli</h1>
          <p class="rail-role" id="rail-role"></p>
          <p class="rail-bio" id="rail-bio"></p>
        </div>

        <nav class="rail-nav" id="nav" aria-label="Sections"></nav>

        <div class="rail-foot">
          <a id="gh-link" href="#" target="_blank" rel="noopener" class="rail-foot-link">github.com/KopalliAditya</a>
          <button id="theme-toggle" class="theme-toggle" aria-label="Switch theme">
            <span class="theme-dot"></span><span id="theme-word">dark</span>
          </button>
        </div>
      </div>
    </aside>

    <main class="content">
      <div class="content-inner" id="view"></div>
      <footer class="content-foot">
        <span>Figures pulled from GUS and GitHub.</span>
        <span id="gen-date"></span>
      </footer>
    </main>
  </div>

  <!-- mobile section switcher -->
  <nav class="mobile-bar" id="mobile-nav" aria-label="Sections (mobile)"></nav>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
